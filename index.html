<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rip List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Rip List</title>
<style>
  :root {
    --bg: #f5f6f8; --surface: #ffffff; --border: #e3e6eb; --text: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --accent-text: #ffffff;
    --ok-bg: #dcfce7; --ok-fg: #166534; --ok-banner: #f0fdf4; --ok-border: #bbf7d0;
    --todo-bg: #fef3c7; --todo-fg: #92400e; --todo-banner: #fffbeb; --todo-border: #fde68a;
    --gone-bg: #e5e7eb; --gone-fg: #374151; --gone-banner: #f3f4f6; --gone-border: #d1d5db;
    --no-banner: #fef2f2; --no-border: #fecaca; --no-fg: #991b1b;
    --info-banner: #eff6ff; --info-border: #bfdbfe; --info-fg: #1e3a8a;
    --poster: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #181b21; --border: #2a2f37; --text: #e8eaed; --muted: #9aa1ab;
      --accent: #3b82f6;
      --ok-bg: #14532d; --ok-fg: #bbf7d0; --ok-banner: #0f2a1a; --ok-border: #166534;
      --todo-bg: #4a3410; --todo-fg: #fde68a; --todo-banner: #2a2010; --todo-border: #854d0e;
      --gone-bg: #30343b; --gone-fg: #d1d5db; --gone-banner: #1f2329; --gone-border: #3f444c;
      --no-banner: #2a1414; --no-border: #7f1d1d; --no-fg: #fecaca;
      --info-banner: #111d33; --info-border: #1e3a8a; --info-fg: #bfdbfe;
      --poster: #2a2f37;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
  [hidden] { display: none !important; }

  /* Unlock screen */
  .lock { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 24px 0; }
  .lock img { width: 72px; height: 72px; border-radius: 18px; }
  .lock h1 { margin: 0; font-size: 26px; }
  .lock p { margin: 0; color: var(--muted); }
  .field { width: 100%; font-size: 17px; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); outline: none; }
  .field:focus { border-color: var(--accent); }
  .btn { font: inherit; font-weight: 600; padding: 13px 16px; border-radius: 12px; border: 0; background: var(--accent);
    color: var(--accent-text); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); padding: 8px 10px; font-weight: 500; }
  .error { color: var(--no-fg); min-height: 1.4em; }

  /* Header + search */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .top h1 { margin: 0; font-size: 22px; }
  .top .sub { color: var(--muted); font-size: 13px; }
  .search { position: relative; }
  .search input { padding-left: 42px; padding-right: 42px; font-size: 18px; }
  .search .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; display: block; }
  .search .clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: none;
    color: var(--muted); font-size: 20px; padding: 8px 10px; cursor: pointer; }

  .answer { margin-top: 10px; border-radius: 12px; padding: 12px 14px; border: 1px solid; display: flex; gap: 10px; align-items: flex-start; font-size: 16px; }
  .answer .mark { font-weight: 700; font-size: 20px; line-height: 1.1; }
  .answer.ok { background: var(--ok-banner); border-color: var(--ok-border); color: var(--ok-fg); }
  .answer.todo { background: var(--todo-banner); border-color: var(--todo-border); color: var(--todo-fg); }
  .answer.gone { background: var(--gone-banner); border-color: var(--gone-border); color: var(--gone-fg); }
  .answer.no { background: var(--no-banner); border-color: var(--no-border); color: var(--no-fg); }
  .answer.info { background: var(--info-banner); border-color: var(--info-border); color: var(--info-fg); }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .chips .sep { flex: 0 0 1px; background: var(--border); margin: 4px 4px; }
  select.chip { appearance: none; -webkit-appearance: none; padding-right: 12px; }

  /* List */
  .count { color: var(--muted); font-size: 13px; margin: 8px 2px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  li { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border); }
  li:first-child { border-top: 0; }
  li a { color: inherit; text-decoration: none; display: contents; }
  .poster { flex: 0 0 40px; width: 40px; height: 60px; border-radius: 4px; background: var(--poster); object-fit: cover; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .year { color: var(--muted); font-weight: 400; }
  .meta { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .pill.s1 { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.s0 { background: var(--todo-bg); color: var(--todo-fg); }
  .pill.s2 { background: var(--gone-bg); color: var(--gone-fg); }
  li.removed { opacity: .65; }
  .more { display: block; width: 100%; margin-top: 10px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 20px; line-height: 1.6; }
  .menu { display: flex; gap: 4px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Unlock -->
  <section id="lock" class="lock" hidden>
    <img src="icon-512.png" alt="">
    <h1>Rip List</h1>
    <p>Enter the passphrase from Rip Manager's Settings. You only need to do this once on this phone.</p>
    <form id="lockForm" autocomplete="on">
      <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="Passphrase" required>
      <div id="lockError" class="error"></div>
      <button class="btn" type="submit" style="width:100%">Unlock</button>
    </form>
  </section>

  <!-- Loading / errors before unlock -->
  <section id="status" class="lock" hidden>
    <img src="icon-512.png" alt="">
    <h1>Rip List</h1>
    <p id="statusText">Loading…</p>
  </section>

  <!-- Main -->
  <main id="app" hidden>
    <header>
      <div class="top">
        <div>
          <h1>Rip List</h1>
          <div class="sub" id="updated"></div>
        </div>
        <div class="menu">
          <button class="btn ghost" id="refreshBtn" type="button" aria-label="Check for a newer list">↻</button>
          <button class="btn ghost" id="lockBtn" type="button" aria-label="Forget passphrase on this phone">Lock</button>
        </div>
      </div>
      <div class="search">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="q" class="field" type="text" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off"
               spellcheck="false" placeholder="Have I got it? Type a title…">
        <button class="clear" id="clearBtn" type="button" aria-label="Clear" hidden>×</button>
      </div>
      <div id="answer" class="answer" hidden><span class="mark" id="answerMark"></span><span id="answerText"></span></div>
      <div class="chips" role="toolbar">
        <button class="chip" data-status="all" aria-pressed="true">All</button>
        <button class="chip" data-status="1" aria-pressed="false">Ripped</button>
        <button class="chip" data-status="0" aria-pressed="false">To rip</button>
        <button class="chip" data-status="2" aria-pressed="false" id="removedChip" hidden>Removed</button>
        <span class="sep"></span>
        <button class="chip" data-kind="all" aria-pressed="true">Movies &amp; TV</button>
        <button class="chip" data-kind="0" aria-pressed="false">Movies</button>
        <button class="chip" data-kind="1" aria-pressed="false">TV</button>
        <span class="sep"></span>
        <select class="chip" id="sort" aria-label="Sort">
          <option value="title">A–Z</option>
          <option value="year">Newest year</option>
          <option value="added">Recently added</option>
        </select>
      </div>
    </header>

    <div class="count" id="count"></div>
    <ul id="list"></ul>
    <button class="btn ghost more" id="moreBtn" type="button" hidden>Show more</button>

    <footer>
      <div id="totals"></div>
      <div>Tap a title to open it on IMDb.</div>
      <div>Movie data and posters from TMDB. This site isn't endorsed or certified by TMDB.</div>
    </footer>
  </main>
</div>

<script>
(() => {
  "use strict";
  const PASS_KEY = "ripList.passphrase";
  const DATA_URL = "list.enc.json";
  const PAGE = 150;              // rows rendered at a time
  const $ = (id) => document.getElementById(id);

  let items = [];                // decrypted list
  let updatedAt = null;
  let statusFilter = "all", kindFilter = "all", sortBy = "title", shown = PAGE;

  // ---------- storage (can fail in private mode) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };

  // ---------- helpers ----------
  const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Same rules as the PC app: lower-case, no accents, no punctuation, "&" = "and", apostrophes dropped.
  function norm(s) {
    return String(s ?? "").replace(/&/g, " and ").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/['’]/g, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  function show(which) {
    for (const id of ["lock", "status", "app"]) $(id).hidden = (id !== which);
  }
  function setStatus(text) { $("statusText").textContent = text; show("status"); }

  // ---------- data ----------
  async function fetchEncrypted() {
    // Always try the network first (bypassing caches); the service worker falls back to the saved copy offline.
    const res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status === 404 ? "nolist" : "HTTP " + res.status);
    return res.json();
  }

  async function decrypt(env, pass) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" },
      keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  let envelope = null;
  async function load(passFromForm) {
    if (!window.crypto || !crypto.subtle) { setStatus("This browser can't open the list. Try Safari or Chrome."); return; }
    try {
      if (!envelope || !passFromForm) envelope = await fetchEncrypted();
    } catch (e) {
      setStatus(e.message === "nolist"
        ? "No list has been published yet. Click Publish in Rip Manager on the PC."
        : "Couldn't load the list. Open this once with an internet connection, then it will work offline.");
      return;
    }
    const pass = passFromForm ?? store.get(PASS_KEY);
    if (!pass) { show("lock"); setTimeout(() => $("pass").focus(), 50); return; }
    try {
      const data = await decrypt(envelope, pass);
      store.set(PASS_KEY, pass);
      items = (data.items || []).map(prep);
      updatedAt = data.updated ? new Date(data.updated) : null;
      $("lockError").textContent = "";
      show("app");
      render();
    } catch {
      store.del(PASS_KEY);
      $("lockError").textContent = passFromForm
        ? "That passphrase didn't work. Check it in Rip Manager → Settings."
        : "The passphrase has changed. Enter the new one.";
      show("lock");
    }
  }

  function prep(it) {
    // t=title y=year s=status(0 to rip,1 ripped,2 removed) k=kind(0 movie,1 tv) i=imdb p=poster a=added d=disk n=notes
    it.hay = " " + norm(it.t) + " " + (it.y || "") + " " + (it.i || "").toLowerCase() + " ";
    it.sortT = norm(it.t).replace(/^(the|a|an) /, "");
    return it;
  }

  // ---------- rendering ----------
  const statusWord = ["To rip", "✓ Ripped", "Removed"];

  function matches(it, tokens) {
    for (const t of tokens) if (!it.hay.includes(t)) return false;
    return true;
  }

  function render() {
    const qText = $("q").value.trim();
    const tokens = norm(qText).split(" ").filter(Boolean);
    $("clearBtn").hidden = !qText;

    // Answer banner (ignores the filter chips on purpose)
    const hits = tokens.length ? items.filter(it => matches(it, tokens)) : [];
    const ans = $("answer");
    if (!tokens.length) {
      ans.hidden = true;
    } else {
      ans.hidden = false;
      let cls, mark, text;
      if (hits.length === 0) { cls = "no"; mark = "✗"; text = `“${qText}” is not on your list.`; }
      else if (hits.length === 1) {
        const h = hits[0], name = h.t + (h.y ? ` (${h.y})` : "");
        if (h.s === 1) { cls = "ok"; mark = "✓"; text = `Yes, you've ripped ${name}.`; }
        else if (h.s === 2) { cls = "gone"; mark = "⊘"; text = `${name} was ripped, but its folder was removed from the drive.`; }
        else { cls = "todo"; mark = "○"; text = `${name} is on your list but NOT ripped yet.`; }
      } else {
        const r = hits.filter(h => h.s === 1).length, g = hits.filter(h => h.s === 2).length;
        cls = "info"; mark = "≡"; text = `${hits.length} matches: ${r} ripped, ${hits.length - r - g} to rip${g ? `, ${g} removed` : ""}.`;
      }
      ans.className = "answer " + cls;
      $("answerMark").textContent = mark;
      $("answerText").textContent = text;
    }

    // List
    let list = items.filter(it =>
      (statusFilter === "all" || it.s === +statusFilter) &&
      (kindFilter === "all" || it.k === +kindFilter) &&
      (!tokens.length || matches(it, tokens)));

    if (sortBy === "year") list.sort((a, b) => (b.y || 0) - (a.y || 0) || a.sortT.localeCompare(b.sortT));
    else if (sortBy === "added") list.sort((a, b) => String(b.a || "").localeCompare(String(a.a || "")) || a.sortT.localeCompare(b.sortT));
    else list.sort((a, b) => a.sortT.localeCompare(b.sortT) || (a.y || 0) - (b.y || 0));

    const slice = list.slice(0, shown);
    $("list").innerHTML = slice.map(rowHtml).join("");
    $("list").hidden = slice.length === 0;
    $("moreBtn").hidden = list.length <= shown;
    $("count").textContent = list.length === items.length ? `${items.length} titles` : `Showing ${list.length} of ${items.length}`;

    const ripped = items.filter(i => i.s === 1).length, removed = items.filter(i => i.s === 2).length;
    $("totals").textContent = `${items.length} titles · ${ripped} ripped · ${items.length - ripped - removed} to rip` + (removed ? ` · ${removed} removed` : "");
    $("removedChip").hidden = removed === 0;
    $("updated").textContent = updatedAt ? "List from " + updatedAt.toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "";
  }

  function rowHtml(it) {
    const poster = it.p
      ? `<img class="poster" loading="lazy" alt="" src="https://image.tmdb.org/t/p/w92${esc(it.p)}" onerror="this.removeAttribute('src')">`
      : `<span class="poster"></span>`;
    const meta = [it.k === 1 ? "TV" : "Movie", it.d, it.n].filter(Boolean).map(esc).join(" · ");
    const inner = `${poster}<div class="info"><div class="title">${esc(it.t)}${it.y ? ` <span class="year">(${it.y})</span>` : ""}</div>` +
                  `<div class="meta">${meta}</div></div><span class="pill s${it.s}">${statusWord[it.s] || ""}</span>`;
    const cls = it.s === 2 ? ' class="removed"' : "";
    return it.i
      ? `<li${cls}><a href="https://www.imdb.com/title/${esc(it.i)}/" target="_blank" rel="noopener">${inner}</a></li>`
      : `<li${cls}>${inner}</li>`;
  }

  // ---------- events ----------
  $("lockForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const p = $("pass").value.trim();
    if (p) load(p);
  });

  let t;
  $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { shown = PAGE; render(); }, 80); });
  $("clearBtn").addEventListener("click", () => { $("q").value = ""; shown = PAGE; render(); $("q").focus(); });
  $("moreBtn").addEventListener("click", () => { shown += PAGE * 2; render(); });
  $("sort").addEventListener("change", (e) => { sortBy = e.target.value; shown = PAGE; render(); });

  document.querySelectorAll(".chip[data-status]").forEach(b => b.addEventListener("click", () => {
    statusFilter = b.dataset.status; shown = PAGE;
    document.querySelectorAll(".chip[data-status]").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  }));
  document.querySelectorAll(".chip[data-kind]").forEach(b => b.addEventListener("click", () => {
    kindFilter = b.dataset.kind; shown = PAGE;
    document.querySelectorAll(".chip[data-kind]").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  }));

  $("refreshBtn").addEventListener("click", async () => {
    $("refreshBtn").textContent = "…";
    envelope = null;
    await load();
    $("refreshBtn").textContent = "↻";
  });

  $("lockBtn").addEventListener("click", () => {
    if (!confirm("Forget the passphrase on this phone? You'll need to type it again next time.")) return;
    store.del(PASS_KEY);
    items = []; $("pass").value = "";
    show("lock");
  });

  // ---------- offline support ----------
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }

  setStatus("Loading…");
  load();
})();
</script>
</body>
</html>
